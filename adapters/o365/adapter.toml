[operation.presentation.consequence]
allows = { de = "Hält die genaue Beobachtung für den geprüften Beleg fest. Eine nachweislich nicht erfolgte Archivierung kann die Sperre für einen neuen, gesondert freizugebenden Vorgang lösen.", en = "Records the exact observation for the reviewed receipt. Confirmed non-application may release its hold for a new, separately authorized operation." }
does_not_allow = { de = "Führt keine Mailaktion aus, verändert keinen ursprünglichen Beleg und erneuert keine alte Freigabe.", en = "Does not execute mail, change the original receipt or renew historical authority." }

