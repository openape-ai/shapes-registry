does_not_allow = { de = "Ändert, sendet und löscht nichts.", en = "Changes, sends and deletes nothing." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation]]
id = "workflow.categorize"
command = ["workflow", "categorize"]
required_options = ["account", "message", "expected-version", "categories"]
value_options = []
flag_options = []
