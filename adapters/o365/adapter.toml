schema = "openape-shapes/v1"

# The IdP enforces protected mail operations. Ordinary move commands are
# retired for agent execution; workflow archive owns preflight and durable
# mailbox-wide reconciliation. Other writes need a new exact human decision.

[cli]
id = "o365"
executable = "o365-cli"
audience = "shapes"
version = "5"
tested_digests = [
  "SHA-256:8bf441b446ec86b4e49956e8fed7a90e17a9caf0734890bbcca74df72b94cdc8",
  "SHA-256:c9def7088b8d0adc85a5b4c28f62b481ab02c3211f0191f12c4b546498ccafb9",
  "SHA-256:e58571770226e9e3041e852887d5dcf12e705f71cbef953125503a8f2bfaf659",
  "SHA-256:879064c86353465fe577bca6d6bf4e8162cbaced04e61cd9359a40d35a2923d6",
  "SHA-256:d613908473cf1de0f34521d047e197fd77991afb2fbef5155bd66ffa658dfb40",
  "SHA-256:4f95ecf9526552582b2138d1bc2bbcfef5c6b6e7d76a125b2bbd497e6c78d978",
  "SHA-256:a15382986e464bb2fee3588391f35bbb52020e520398754ea2876d011b11c88b",
  "SHA-256:7f00d428b6f941d158410e3526146239ef5df3deb574aef2969236cf63ed0dd7",
  "SHA-256:83eecd1da1c1a925bb7cca47726157061e3cfdfdfae3492fe7b3bb0d18a69d41",
]

# ══════════════════════════════════════════════════════
# AUTH
# ══════════════════════════════════════════════════════

[[operation]]
id = "auth.login"
command = ["auth", "login"]
value_options = ["account"]
flag_options = []
display = "Login to Microsoft 365 account"
action = "create"
decision = "once"
risk = "medium"
exact_command = true
resource_chain = ["auth:*"]

[[operation]]
id = "auth.logout"
command = ["auth", "logout"]
positionals = ["email"]
display = "Logout from account {email}"
action = "delete"
decision = "once"
risk = "medium"
exact_command = true
resource_chain = ["auth:email={email}"]

[[operation]]
id = "auth.logout-all"
command = ["auth", "logout", "--all"]
display = "Logout from all accounts"
action = "delete"
decision = "once"
risk = "high"
exact_command = true
resource_chain = ["auth:*"]

[[operation]]
id = "auth.list"
command = ["auth", "list"]
display = "List logged-in accounts"
action = "list"
risk = "low"
resource_chain = ["auth:*"]

[[operation]]
id = "auth.status"
command = ["auth", "status"]
display = "Show auth token status"
action = "read"
risk = "low"
resource_chain = ["auth:*"]

# ══════════════════════════════════════════════════════
# MAIL — Read Operations
# ══════════════════════════════════════════════════════

[[operation]]
id = "mail.list.account"
command = ["mail", "list"]
required_options = ["account"]
value_options = ["folder", "limit"]
flag_options = ["json", "oldest-first", "unread", "with-body"]
display = "List emails of {account}"
action = "list"
risk = "low"
resource_chain = ["account:email={account}", "mail:*"]

[operation.presentation]
title = { de = "E-Mails von {account} auflisten", en = "List the mail of {account}" }

[operation.presentation.consequence]
allows = { de = "Liest die Liste der E-Mails eines Ordners dieses Kontos.", en = "Reads the mail list of a folder of this account." }
does_not_allow = { de = "Ändert, sendet und löscht nichts.", en = "Changes, sends and deletes nothing." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation]]
id = "mail.list"
command = ["mail", "list"]
value_options = ["folder", "limit"]
flag_options = ["json", "oldest-first", "unread", "with-body"]
display = "List emails (all accounts)"
action = "list"
risk = "low"
resource_chain = ["account:email=*", "mail:*"]

[[operation]]
id = "mail.read"
command = ["mail", "read"]
positionals = ["message_id"]
required_options = ["account"]
display = "Read email {message_id} from account {account}"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "mail:id={message_id}"]

[[operation]]
id = "mail.search"
command = ["mail", "search"]
display = "Search emails (all accounts)"
action = "search"
risk = "low"
resource_chain = ["account:email=*", "mail:*"]

[[operation]]
id = "mail.query"
command = ["mail", "query"]
positionals = ["search_text"]
display = "Search emails via KQL: {search_text}"
action = "search"
risk = "low"
resource_chain = ["account:email=*", "mail:*"]

[[operation]]
id = "mail.attachments"
command = ["mail", "attachments"]
positionals = ["message_id"]
required_options = ["account"]
display = "Download attachments from email {message_id}"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "mail:id={message_id}"]

