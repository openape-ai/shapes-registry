[[operation]]
id = "workflow.move"
command = ["workflow", "move"]
required_options = ["account", "message", "expected-version", "source-folder", "destination"]
value_options = []
flag_options = []
display = "Move messages of {account} into {destination}"
action = "move"
decision = "deny"
risk = "high"
resource_chain = ["account:email={account}", "destination:name={destination}", "mail:*"]

[operation.presentation]
title = { de = "Nachrichten von {account} nach {destination} verschieben", en = "Move messages of {account} into {destination}" }

[operation.presentation.consequence]
allows = { de = "Verschiebt jede Nachricht dieses Kontos, eine pro Aufruf, in genau diesen Ordner, solange sie seit dem Lesen unverändert ist.", en = "Moves any message of this account, one per call, into exactly this folder while it is unchanged since it was read." }
does_not_allow = { de = "Verschiebt in keinen anderen Ordner und löscht nichts.", en = "Moves into no other folder and deletes nothing." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation.presentation.facts]]
label = { de = "Zielordner", en = "Destination folder" }
binding = "destination"
format = "code"


