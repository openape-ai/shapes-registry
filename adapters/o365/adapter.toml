# ══════════════════════════════════════════════════════
# WORKFLOW — account-scoped JSON transport for OpenApe Pods
# ══════════════════════════════════════════════════════

[[operation]]
id = "workflow.delta"
command = ["workflow", "delta"]
required_options = ["account", "folder"]
value_options = ["cursor"]
flag_options = []
display = "Read {folder} changes of {account}"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "folder:name={folder}", "mail:*"]

[operation.presentation]
title = { de = "Änderungen in {folder} von {account} lesen", en = "Read the changes in {folder} of {account}" }

[operation.presentation.consequence]
allows = { de = "Liest alle neuen und geänderten Nachrichten dieses Ordners samt Inhalt, beliebig oft.", en = "Reads all new and changed messages of this folder with their content, any number of times." }
does_not_allow = { de = "Ändert, sendet und löscht nichts.", en = "Changes, sends and deletes nothing." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation.presentation.facts]]
label = { de = "Ordner", en = "Folder" }
binding = "folder"
format = "code"

[[operation]]
id = "workflow.find"
command = ["workflow", "find"]
required_options = ["account", "folder"]
value_options = ["with", "without", "top"]
flag_options = ["has-attachments", "oldest"]
display = "Find messages in {folder} of {account} by category"
action = "read"
risk = "low"
resource_chain = ["account:email={account}", "folder:name={folder}", "mail:*"]

[operation.presentation]
title = { de = "Nachrichten in {folder} von {account} nach Kategorie finden", en = "Find messages in {folder} of {account} by category" }

[operation.presentation.consequence]
allows = { de = "Liest IDs, Eingangszeit, Kategorien und Anhang-Kennzeichen passender Nachrichten dieses Ordners, beliebig oft.", en = "Reads ids, received time, categories and attachment flag of matching messages in this folder, any number of times." }
does_not_allow = { de = "Liest keine Inhalte und ändert, sendet und löscht nichts.", en = "Reads no content and changes, sends and deletes nothing." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation.presentation.facts]]
label = { de = "Ordner", en = "Folder" }
binding = "folder"
format = "code"

[[operation]]
id = "workflow.attachments"
command = ["workflow", "attachments"]
required_options = ["account", "message", "save-to"]
value_options = []
flag_options = []
display = "Save PDF attachments of messages of {account} into {save-to}"
action = "download"
risk = "medium"
# The target directory is part of the permission, so a grant cannot write files anywhere else.
resource_chain = ["account:email={account}", "directory:path={save-to}", "mail:*"]

[operation.presentation]
title = { de = "PDF-Anhänge von Nachrichten in {account} nach {save-to} speichern", en = "Save PDF attachments of messages in {account} into {save-to}" }

[operation.presentation.consequence]
allows = { de = "Liest die Anhänge einer Nachricht und legt PDF-Dateien unter ihrem Hash im angegebenen Ordner ab, beliebig oft.", en = "Reads the attachments of one message and stores PDF files under their hash in the given folder, any number of times." }
does_not_allow = { de = "Ändert, verschiebt, sendet und löscht keine Nachrichten und überschreibt keine anderen Dateien.", en = "Does not change, move, send or delete messages and does not overwrite other files." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation.presentation.facts]]
label = { de = "Ordner", en = "Folder" }
binding = "save-to"
format = "code"

[[operation]]
id = "workflow.archive-labelled"
command = ["workflow", "archive-labelled"]
required_options = ["account", "message", "label", "content-version"]
value_options = []
flag_options = []
display = "Archive messages of {account} labelled {label}"
action = "archive"
risk = "medium"
# Deliberately scoped to the label, not to one message (owner decision for unattended invoice filing):
# a standing grant archives only Inbox mail that carries this label and still has the assessed content.
resource_chain = ["account:email={account}", "label:name={label}", "mail:*"]

[operation.presentation]
title = { de = "Nachrichten in {account} mit Label {label} archivieren", en = "Archive messages in {account} labelled {label}" }

[operation.presentation.consequence]
allows = { de = "Verschiebt Nachrichten aus dem Posteingang ins Archiv, aber nur solange sie dieses Label tragen und ihr bewerteter Inhalt unverändert ist.", en = "Moves messages from the Inbox to Archive, but only while they carry this label and their assessed content is unchanged." }
does_not_allow = { de = "Archiviert keine Nachrichten ohne dieses Label, löscht und sendet nichts.", en = "Does not archive messages without this label and deletes or sends nothing." }

[[operation.presentation.facts]]
label = { de = "Konto", en = "Account" }
binding = "account"
format = "code"

[[operation.presentation.facts]]
label = { de = "Label", en = "Label" }
binding = "label"
format = "code"

