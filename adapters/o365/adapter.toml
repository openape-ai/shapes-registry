schema = "openape-shapes/v1"

# o365-cli (issue 1473). Every o365-cli build prints the same version text
# (v2.1.1), including the builds with the account-scoped `workflow` commands
# that OpenApe Pods use, so the tested builds are listed by file digest.
# Account-scoped calendar and mail reads come before the all-account forms, so
# an argv with --account binds the account. `workflow move` binds the account
# and destination folder, not the message: OpenApe Pods run it only through the
# archive service, which also needs the owner's approval of each message
# (mail.archive); a per-message grant would ask twice for every move.

[cli]
id = "o365"
executable = "o365-cli"
audience = "shapes"
version = "3"
tested_digests = [
  "SHA-256:d613908473cf1de0f34521d047e197fd77991afb2fbef5155bd66ffa658dfb40",
  "SHA-256:4f95ecf9526552582b2138d1bc2bbcfef5c6b6e7d76a125b2bbd497e6c78d978",
  "SHA-256:a15382986e464bb2fee3588391f35bbb52020e520398754ea2876d011b11c88b",
]

# ══════════════════════════════════════════════════════
# AUTH
# ══════════════════════════════════════════════════════

[[operation]]
id = "auth.login"
command = ["auth", "login"]
value_options = ["account"]
flag_options = []
display = "Login to Microsoft 365 account"
action = "create"
risk = "medium"
resource_chain = ["auth:*"]

[[operation]]
id = "auth.logout"
command = ["auth", "logout"]
positionals = ["email"]
display = "Logout from account {email}"
action = "delete"
risk = "medium"
exact_command = true
resource_chain = ["auth:email={email}"]

[[operation]]
id = "auth.logout-all"
command = ["auth", "logout", "--all"]
display = "Logout from all accounts"
action = "delete"
risk = "high"
exact_command = true
resource_chain = ["auth:*"]

[[operation]]
id = "auth.list"
command = ["auth", "list"]
display = "List logged-in accounts"
action = "list"
risk = "low"
resource_chain = ["auth:*"]

[[operation]]
id = "auth.status"
command = ["auth", "status"]
display = "Show auth token status"
action = "read"
risk = "low"
resource_chain = ["auth:*"]

