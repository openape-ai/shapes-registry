name: Registry checks

# The canonical repository is repos.openape.ai; Forgejo and GitHub are read-only
# mirrors. CI therefore verifies the committed registry.json instead of
# committing a regenerated one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned check dependencies
        run: npm ci

      # Strict parsing, JSON schemas, golden argv fixtures, the hostile-option
      # matrix and, for CLIs installed here in a tested version, their help output.
      # A missing or untested CLI is reported as a notice, not a failure.
      - name: Check registry.json and adapters
        run: npm run check
